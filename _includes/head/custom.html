{% include base_path %}

<!-- start custom head snippets -->

<!-- Keep the public site in light mode with a white page background. -->
<script>
  try { localStorage.setItem("theme", "light"); } catch (error) {}
  document.documentElement.removeAttribute("data-theme");
</script>
<style>
  html,
  body {
    background-color: #ffffff !important;
  }
</style>

<!-- Open Sans for the Academic Service and Publications sections. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Robot favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=robot"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=robot" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=robot" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=robot"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
